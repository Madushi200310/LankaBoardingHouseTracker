spring.application.name=backend

# ─── Profile ─────────────────────────────────────────────────────────────
# Local dev uses the "local" profile (reads application-local.properties).
# In production, set SPRING_PROFILES_ACTIVE=prod (or omit → falls back to local).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ─── JPA / Hibernate ─────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─── JWT ─────────────────────────────────────────────────────────────────
# Lifetime in milliseconds (86400000 = 24h). Not a secret — safe default.
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ─── Secrets (MUST be provided via env vars in production) ───────────────
# In local dev, these come from application-local.properties instead.
# No default on purpose: startup fails loudly if they're missing.
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
jwt.secret=${JWT_SECRET:}

# ─── Default admin seed (optional) ───────────────────────────────────────
# Leave blank to skip admin seeding entirely (recommended for prod —
# create the admin manually or seed once via env vars).
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}